[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inferencedeck"
version = "0.1.0"
description = "A Textual TUI to manage vLLM and SGLang container runtimes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "textual[syntax]>=0.80",
    "docker>=7.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
inferencedeck = "inferencedeck.__main__:main"

[tool.setuptools.packages.find]
include = ["inferencedeck*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
